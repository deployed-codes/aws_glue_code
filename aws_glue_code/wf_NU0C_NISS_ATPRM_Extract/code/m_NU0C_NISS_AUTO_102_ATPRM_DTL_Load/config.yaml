job:
  name: m_NU0C_NISS_AUTO_102_ATPRM_DTL_Load

spark:
  app_name: m_NU0C_NISS_AUTO_102_ATPRM_DTL_Load

  conf:
    spark.sql.shuffle.partitions: "20"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.serializer: "org.apache.spark.serializer.KryoSerializer"

  log_level: WARN

logging:
  provider: stdlib
  level: INFO
  format: json

# Environment-specific values, read in job.py via self._require_env(self.env, "<KEY>").
# REPLACE_WITH_ values fail the job at start. SNOWFLAKE_CONNECTION_* values are AWS Glue Connection names.
env:
  S3_OUTPUT_BUCKET: "REPLACE_WITH_S3_OUTPUT_BUCKET"
  GLUE_DATABASE: "REPLACE_WITH_GLUE_DATABASE"
  RUN_TYPE: "REPLACE_WITH_RUN_TYPE"
  GEO_ST_NM_BCKP: "REPLACE_WITH_GEO_ST_NM_BCKP"
  RPT_YEAR: "REPLACE_WITH_RPT_YEAR"
  BACKENDFIX_DT: "REPLACE_WITH_BACKENDFIX_DT"
  CLNDR_YR: "REPLACE_WITH_CLNDR_YR"
  SNOWFLAKE_CONNECTION_FDWS_FDRWRK: "REPLACE_WITH_SNOWFLAKE_CONNECTION_FDWS_FDRWRK"
  SNOWFLAKE_CONNECTION_DBCONNECTION_FDWS_REF_ODBC: "REPLACE_WITH_SNOWFLAKE_CONNECTION_DBCONNECTION_FDWS_REF_ODBC"
