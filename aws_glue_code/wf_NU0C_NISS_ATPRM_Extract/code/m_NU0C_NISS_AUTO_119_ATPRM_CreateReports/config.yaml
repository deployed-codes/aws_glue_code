job:
  name: m_NU0C_NISS_AUTO_119_ATPRM_CreateReports

spark:
  app_name: m_NU0C_NISS_AUTO_119_ATPRM_CreateReports

  conf:
    spark.sql.shuffle.partitions: "20"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.serializer: "org.apache.spark.serializer.KryoSerializer"

  log_level: WARN

logging:
  provider: stdlib
  level: INFO
  format: json

# Environment-specific values, read in job.py via self._require_env(self.env, "<KEY>").
# REPLACE_WITH_ values fail the job at start. SNOWFLAKE_CONNECTION_* values are AWS Glue Connection names.
env:
  S3_OUTPUT_BUCKET: "REPLACE_WITH_S3_OUTPUT_BUCKET"
  GLUE_DATABASE: "REPLACE_WITH_GLUE_DATABASE"
  PM_TARGET_FILE_DIR: "REPLACE_WITH_PM_TARGET_FILE_DIR"
  OUTPUTFILE_PREMRPT3_SUM: "REPLACE_WITH_OUTPUTFILE_PREMRPT3_SUM"
  OUTPUTFILE_PREMRPT1_DET: "REPLACE_WITH_OUTPUTFILE_PREMRPT1_DET"
  OUTPUTFILE_PREMRPT_EXP: "REPLACE_WITH_OUTPUTFILE_PREMRPT_EXP"
  OUTPUTFILE_PREMRPT2_FNLCSV: "REPLACE_WITH_OUTPUTFILE_PREMRPT2_FNLCSV"
  OUTPUTFILE_PREMRPT2_FNLTXT: "REPLACE_WITH_OUTPUTFILE_PREMRPT2_FNLTXT"
